name: SEO completion checks

on:
  push:
    branches:
      - seo-completion-20260929
  pull_request:
    paths:
      - 'src/routes/_authenticated/route.tsx'
      - 'src/routes/auth.tsx'
      - 'src/routes/reset-password.tsx'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'scripts/seo-contract.mjs'
      - 'package.json'
      - '.github/workflows/seo-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run SEO privacy contract
        run: bun run test:seo
      - name: Build production bundle
        run: bun run build
